<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BugDeck icon preview</title>
<style>
  body { background:#1a1a1a; font:14px/1.5 system-ui,sans-serif; color:#eee; margin:0; padding:24px; }
  .row { display:flex; gap:32px; align-items:flex-end; flex-wrap:wrap; }
  figure { margin:0; text-align:center; }
  .tile { border-radius:22%; overflow:hidden; box-shadow:0 8px 30px #0008; }
  .s48 { width:48px; height:48px; }
  .s96 { width:96px; height:96px; }
  .s192 { width:192px; height:192px; }
  .circle { border-radius:50%; }
  figcaption { margin-top:10px; font-size:12px; color:#aaa; }
  h2 { font-size:15px; margin:32px 0 14px; color:#ff8a8a; }
</style>
</head>
<body>
<h2>Adaptive icon — bow glyph (same path data as ic_launcher_fg.xml)</h2>
<div class="row">
  <figure><div class="tile s192" id="a192"></div><figcaption>192px (round-ish mask)</figcaption></figure>
  <figure><div class="tile s96" id="a96"></div><figcaption>96px</figcaption></figure>
  <figure><div class="tile s48" id="a48"></div><figcaption>48px</figcaption></figure>
  <figure><div class="tile circle s96" id="acirc"></div><figcaption>circle mask</figcaption></figure>
</div>

<h2>Palette</h2>
<div class="row" id="pal"></div>

<script>
// Vector path data copied verbatim from res/drawable/ic_launcher_fg.xml
const PATHS = [
  ["#FFFFFF","M48,53 C42,47 33,46 29,51 C25,56 29,63 36,64 C41,65 46,61 48,57 Z"],
  ["#FFFFFF","M60,53 C66,47 75,46 79,51 C83,56 79,63 72,64 C67,65 62,61 60,57 Z"],
  ["#FFFFFF","M47,44 L61,44 C64,44 66,46.5 66,49.5 L66,58.5 C66,61.5 64,64 61,64 L47,64 C44,64 42,61.5 42,58.5 L42,49.5 C42,46.5 44,44 47,44 Z"],
  ["#FFFFFF","M45,62 L37,81 L47,84 L52,64 Z"],
  ["#FFFFFF","M63,62 L71,81 L61,84 L56,64 Z"],
];

function svg(px, inset) {
  const V = 108, pad = inset;
  let s = `<svg viewBox="${pad} ${pad} ${V-pad*2} ${V-pad*2}" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg">`;
  for (const [c,d] of PATHS) s += `<path fill="${c}" d="${d}"/>`;
  return s + `</svg>`;
}

// adaptive icons are cropped: the launcher shows the central 72/108 of the vector
const masked = svg(1, 18);
for (const id of ["a192","a96","a48","acirc"]) {
  document.getElementById(id).innerHTML =
    `<div style="width:100%;height:100%;background:#C62828">${masked.replace('width="1" height="1"','width="100%" height="100%" style="display:block"')}</div>`;
}

const COLORS = [
  ["primary","#C62828"],["crimson_dark","#8E1414"],["blush","#FBE4E4"],
  ["charcoal","#2B2224"],["vuln","#C62828"],["safe","#2E6B33"],
  ["warn","#9A6300"],["skip","#6B5B5D"],["surfaceVariant","#F2DDDC"],
];
document.getElementById("pal").innerHTML = COLORS.map(([n,c]) =>
  `<figure><div style="width:96px;height:64px;border-radius:8px;background:${c};box-shadow:0 4px 14px #0006"></div>
   <figcaption>${n}<br>${c}</figcaption></figure>`).join("");
</script>
</body>
</html>
