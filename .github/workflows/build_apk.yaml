name: Build and Sign APK

on:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the code
      - uses: actions/checkout@v4
      
      # 2. Set up Java 17 (required for Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # 3. Generate Keystore automatically
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-release-key.keystore \
          -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug, O=Android, C=US"
          
      # 4. Build the APK (uses pre-installed Android SDK)
      - name: Build APK
        run: ./gradlew assembleDebug || ./gradlew assembleRelease
        
      # 5. Sign the APK (Using V2 signature which is mandatory for modern Android)
      - name: Sign APK
        run: |
          apksigner sign \
            --ks my-release-key.keystore \
            --ks-pass pass:android \
            --ks-key-alias my-alias \
            --out signed.apk \
            unsigned.apk
            
      # 6. Upload the signed APK
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignedAPK
          path: signed.apk