name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: find sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- find:"
          find /usr/local/lib/android/sdk -name sdkmanager 2>/dev/null || echo "none in /usr/local"
          echo "--- ls cmdline-tools:"
          ls /usr/local/lib/android/sdk/cmdline-tools 2>/dev/null || echo "no cmdline-tools dir"
          echo "--- which:"
          which sdkmanager || echo "not on PATH"
