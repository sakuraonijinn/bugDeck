name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The detection core is plain java.io/java.net, so it is tested on a bare JDK
  # with no SDK at all. This runs first and fast.
  core:
    name: core tests (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: build and run suites
        run: bash build.sh

  apk:
    name: debug APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # android-actions/setup-android@v3 is NOT used because it runs
      # `sdkmanager tools`, which Google no longer publishes.
      #
      # ubuntu-latest ships an SDK at $ANDROID_HOME, but sdkmanager is
      # NOT on PATH. Resolve it explicitly.
      - name: grant sdk licenses and install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "could not locate sdkmanager under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: make gradlew executable
        run: chmod +x gradlew

      - uses: gradle/actions/wrapper-validation@v4

      - name: assembleDebug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: test the debug APK exists and is a real APK
        run: |
          set -e
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$apk" ]; then echo "no APK produced"; exit 1; fi
          echo "built: $apk ($(stat -c%s "$apk") bytes)"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml' \
            || { echo "APK has no manifest"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bugdeck-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # The app's client and the server have to agree. This runs the real
  # UnifiedClient against the real bugXhunter server, so a change to
  # either side that breaks the contract fails here rather than on a
  # phone in the field.
  contract:
    name: app and server contract
    runs-on: ubuntu-latest
    needs: core

    steps:
      - name: Checkout BugDeck repo
        uses: actions/checkout@v5

      - name: Clone bugXhunter server repo
        uses: actions/checkout@v5
        with:
          repository: sakuraonijinn/bugXhunter
          path: bugxhunter

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install the server dependencies
        run: pip install uvicorn starlette aiohttp

      - name: fetch org.json and the android platform
        run: |
          set -euo pipefail
          mkdir -p lib
          curl -sSL -o lib/json.jar \
            https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" > /dev/null

          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_JAR"
          echo "android.jar: $ANDROID_JAR"

      - name: start the server
        env:
          AUTH_TOKEN: testtoken12345
        run: |
          set -euo pipefail
          cd bugxhunter
          python3 -m uvicorn bugxhunter.server:app --host 127.0.0.1 --port 7080 &
          echo $! > /tmp/bugxhunter.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7080/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7080/health >/dev/null \
            || { echo "server did not start"; exit 1; }

      - name: compile and run the contract test
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p out
          javac -nowarn -d out -cp "$ANDROID_JAR:lib/json.jar" \
            core/src/main/java/com/bugtraqapps/bugdeck/core/*.java \
            app/src/main/java/com/bugtraqapps/bugdeck/UnifiedClient.java \
            app/src/main/java/com/bugtraqapps/bugdeck/SecurityCheck.java \
            app/src/test/java/com/bugtraqapps/bugdeck/ContractTest.java
          java -cp "out:lib/json.jar" com.bugtraqapps.bugdeck.ContractTest \
            http://127.0.0.1:7080 testtoken12345

      - name: stop the server
        if: always()
        run: kill "$(cat /tmp/bugxhunter.pid)" 2>/dev/null || true

  # Test bugXhunter server (separate repo: sakuraonijinn/bugXhunter)
  bugxhunter:
    name: bugXhunter server
    runs-on: ubuntu-latest
    needs: apk
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout BugDeck repo
        uses: actions/checkout@v5

      - name: Clone bugXhunter server repo
        uses: actions/checkout@v5
        with:
          repository: sakuraonijinn/bugXhunter
          path: bugxhunter
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uvicorn starlette aiohttp
          echo "Bugxhunter server dependencies installed"

      - name: Test bugXhunter server
        env:
          AUTH_TOKEN: testtoken12345
        run: |
          cd bugxhunter
          python3 -m uvicorn bugxhunter.server:app --host 127.0.0.1 --port 7080 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Wait for the server to answer rather than sleeping blindly.
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7080/health >/dev/null && break
            sleep 1
          done

          check() { # name expected actual
            if [ "$2" = "$3" ]; then
              echo "  ok   $1 ($3)"
            else
              echo "  FAIL $1: expected $2, got $3"
              exit 1
            fi
          }

          echo "--- endpoints ---"
          check "health (public)"    200 "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7080/health)"
          check "status (no token)"  401 "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7080/status)"
          check "status (bad token)" 401 "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Auth-Token: wrong' http://127.0.0.1:7080/status)"
          check "status (good token)" 200 "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Auth-Token: testtoken12345' http://127.0.0.1:7080/status)"
          check "diagnose"           200 "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Auth-Token: testtoken12345' http://127.0.0.1:7080/diagnose)"
          check "tools"              200 "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Auth-Token: testtoken12345' http://127.0.0.1:7080/tools)"
          check "bugSteps (no token)" 401 "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7080/bugSteps)"
          check "bugSteps (token)"   200 "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Auth-Token: testtoken12345' http://127.0.0.1:7080/bugSteps)"

          echo "--- payloads ---"
          curl -s http://127.0.0.1:7080/health
          echo ""
          curl -s -H "X-Auth-Token: testtoken12345" http://127.0.0.1:7080/status
          echo ""
          curl -s -H "X-Auth-Token: testtoken12345" http://127.0.0.1:7080/diagnose | head -c 400
          echo ""

          echo "--- operator CLI ---"
          export BUGXHUNTER_HOST=http://127.0.0.1:7080
          export BUGXHUNTER_TOKEN=testtoken12345
          python3 -m bugxhunter.client steps > /dev/null && echo "  ok   xbug steps"
          python3 -m bugxhunter.client status | head -c 200
          echo ""

      - name: Check the operator CLI standalone
        working-directory: bugxhunter
        run: |
          # The steps command is local content and must work with no server.
          python3 -m bugxhunter.client steps > /dev/null
          echo "  ok   xbug steps (no server needed)"
          python3 -m bugxhunter.client tools | head -c 200
          echo ""

      - name: Lint the Frida hook library
        working-directory: bugxhunter
        run: |
          # The hooks cannot be run without a device, so they are checked
          # statically: syntax, hooks installed on a dispatcher rather than
          # a named overload, and replacements that call themselves.
          python3 -m bugxhunter.client hooks lint
          echo "  ok   hook library clean"

  # Release: upload APK as GitHub Release
  release:
    name: Upload APK release
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gh CLI
        run: sudo apt-get install -y gh

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "BugDeck Release ${{ github.ref_name }}" \
            --notes "Auto-generated release with BugDeck APK + bugXhunter server" \
            app/build/outputs/apk/debug/*.apk

  # Deploy bugXhunter to any machine you control (manual trigger)
  deploy-bugxhunter:
    name: Deploy bugXhunter (self-hosted)
    runs-on: ubuntu-latest
    needs: apk
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Clone bugXhunter server repo
        uses: actions/checkout@v5
        with:
          repository: sakuraonijinn/bugXhunter
          path: bugxhunter
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        run: |
          pip install uvicorn starlette aiohttp

      - name: Deploy instructions
        run: |
          echo "=== BugXhunter Deployment Instructions ==="
          echo ""
          echo "1. On your target server (Ubuntu/Debian):"
          echo "   sudo apt update && sudo apt install -y python3 python3-pip"
          echo "   pip3 install uvicorn starlette aiohttp"
          echo ""
          echo "2. Copy the bugxhunter/ folder from this repo to your server"
          echo ""
          echo "3. Update config.json with your server details"
          echo ""
          echo "4. Start the server:"
          echo "   AUTH_TOKEN=your-secret python3 -m uvicorn bugxhunter.server:app --host 0.0.0.0 --port 7080"
          echo ""
          echo "5. Configure BugDeck Android app with server URL and token"
          echo ""
          echo "6. For public access, consider:"
          echo "   - Tailscale Funnel (free for personal use)"
          echo "   - Cloudflare Tunnel (free tier available)"
          echo "   - Port forwarding on your router"
