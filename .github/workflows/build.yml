name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The detection core is plain java.io/java.net, so it is tested on a bare JDK
  # with no SDK at all. This runs first and fast.
  core:
    name: core tests (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: build and run suites
        run: bash build.sh

  apk:
    name: debug APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # android-actions/setup-android@v3 is NOT used because it runs
      # `sdkmanager tools`, which Google no longer publishes.
      #
      # ubuntu-latest ships an SDK at $ANDROID_HOME, but sdkmanager is
      # NOT on PATH. Resolve it explicitly.
      - name: grant sdk licenses and install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "could not locate sdkmanager under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: make gradlew executable
        run: chmod +x gradlew

      - uses: gradle/actions/wrapper-validation@v4

      - name: assembleDebug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: test the debug APK exists and is a real APK
        run: |
          set -e
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$apk" ]; then echo "no APK produced"; exit 1; fi
          echo "built: $apk ($(stat -c%s "$apk") bytes)"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml' \
            || { echo "APK has no manifest"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bugdeck-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # Deploy bugXhunter server (Raspberry Pi / VPS / NixOS VM)
  bugxhunter:
    name: bugXhunter server
    runs-on: ubuntu-latest
    needs: apk
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uvicorn starlette aiohttp
          echo "Bugxhunter server dependencies installed"

      - name: Test bugxhunter server (if present)
        run: |
          if [ -d "bugxhunter" ]; then
            cd bugxhunter
            timeout 10 python3 -m uvicorn bugxhunter_server:app --host 0.0.0.0 --port 7080 &
            sleep 5
            curl -s http://localhost:7080/health
          else
            echo "No bugxhunter directory - skipping server test"
          fi

  # Release: upload APK as GitHub Release
  release:
    name: Upload APK release
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gh CLI
        run: sudo apt-get install -y gh

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "BugDeck Release ${{ github.ref_name }}" \
            --notes "Auto-generated release with BugDeck APK + bugXhunter server" \
            app/build/outputs/apk/debug/*.apk

  # Deploy bugXhunter to any machine you control (manual trigger)
  deploy-bugxhunter:
    name: Deploy bugXhunter (self-hosted)
    runs-on: ubuntu-latest
    needs: apk
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Clone bugXhunter server repo
        uses: actions/checkout@v5
        with:
          repository: bugtraqapps/bugxhunter
          path: bugxhunter
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        run: |
          pip install uvicorn starlette aiohttp

      - name: Deploy instructions
        run: |
          echo "=== BugXhunter Deployment Instructions ==="
          echo ""
          echo "1. On your target server (Ubuntu/Debian):"
          echo "   sudo apt update && sudo apt install -y python3 python3-pip"
          echo "   pip3 install uvicorn starlette aiohttp"
          echo ""
          echo "2. Copy the bugxhunter/ folder from this repo to your server"
          echo ""
          echo "3. Update config.json with your server details"
          echo ""
          echo "4. Start the server:"
          echo "   AUTH_TOKEN=your-secret python3 -m uvicorn bugxhunter.server:app --host 0.0.0.0 --port 7080"
          echo ""
          echo "5. Configure BugDeck Android app with server URL and token"
          echo ""
          echo "6. For public access, consider:"
          echo "   - Tailscale Funnel (free for personal use)"
          echo "   - Cloudflare Tunnel (free tier available)"
          echo "   - Port forwarding on your router"
