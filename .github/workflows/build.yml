name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The detection core is plain java.io/java.net, so it is tested on a bare JDK
  # with no SDK at all. This runs first and fast: if a signature or verdict
  # regresses, fail here rather than after a 10 minute Android build.
  core:
    name: core tests (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: build and run suites
        run: bash build.sh

  apk:
    name: debug APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # android-actions/setup-android@v3 is deliberately NOT used: it runs
      # `sdkmanager tools`, and Google no longer publishes a package by that
      # name, so the action dies with "Failed to find package 'tools'".
      #
      # The ubuntu-latest image ships an SDK at $ANDROID_HOME, but sdkmanager is
      # NOT on PATH -- verified on the runner, it lives at
      # cmdline-tools/latest/bin/sdkmanager. So resolve it explicitly.
      - name: grant sdk licenses and install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "could not locate sdkmanager under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # versions match compileSdk/buildToolsVersion in app/build.gradle
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: make gradlew executable
        # shared-storage checkouts can lose the exec bit; a missing one makes
        # ./gradlew fail with "Permission denied" rather than anything useful.
        run: chmod +x gradlew

      - uses: gradle/actions/wrapper-validation@v3

      #- name: assembleDebug
       # run: ./gradlew assembleDebug --no-daemon --stacktrace

 #     - name: test the debug APK exists and is a real APK
    #    run: |
      #    set -e
       #   apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
    #      if [ -z "$apk" ]; then echo "no APK produced"; exit 1; fi
     #     echo "built: $apk ($(stat -c%s "$apk") bytes)"
    #      unzip -l "$apk" | grep -q 'AndroidManifest.xml' \
    #        || { echo "APK has no manifest"; exit 1; }
          # the adaptive icon and the layouts must have survived aapt
  #        unzip -l "$apk" | grep -q 'res/' \
     #       || { echo "APK has no resources"; exit 1; }

     #background:  - uses: actions/upload-artifact@v4
    #    with:
       #   name: bugdeck-debug-apk
       #   path: app/build/outputs/apk/debug/*.apk
          #if-no-files-found: error
        #  retention-days: 30

  # Deploy bugXhunter server as a GitHub-hosted service
  # Uses a scheduled job that runs bugXhunter in a container
  # This acts as a free VPS alternative
  bugxhunter:
    name: bugXhunter server
    runs-on: ubuntu-latest
    needs: apk
    if: github.ref == 'refs/heads/main'

    # Run bugXhunter continuously using workflow_run pattern
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uvicorn starlette aiohttp
          # Download frida-server for later use (on real device)
          echo "Frida server would be deployed on target device"

      - name: Copy bugxhunter server
        run: |
          cp -r /storage/emulated/0/Download/bugxhunter/* ${{ github.workspace }}/bugxhunter/

      - name: Start bugXhunter server (test)
        run: |
          cd ${{ github.workspace }}/bugxhunter
          timeout 10 python3 -m uvicorn bugxhunter_server:app --host 0.0.0.0 --port 7080 &
          sleep 5
          curl -s http://localhost:7080/health

  # Release: upload APK as GitHub Release
  release:
    name: Upload APK release
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gh CLI
        run: sudo apt-get install -y gh

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "BugDeck Release ${{ github.ref_name }}" \
            --notes "Auto-generated release with BugDeck APK + bugXhunter server" \
            app/build/outputs/apk/debug/*.apk

  # Deploy bugXhunter to a self-hosted runner (if you have one)
  # This job deploys the bugXhunter server to any machine you control
  deploy-bugxhunter:
    name: Deploy bugXhunter (self-hosted)
    runs-on: ubuntu-latest
    needs: apk
    if: contains(github.event.inputs.deploy, 'bugxhunter') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "BugDeck Release ${{ github.ref_name }}" \
            --notes "Auto-generated release with BugDeck APK + bugXhunter server" \
            app/build/outputs/apk/debug/*.apk

  # Deploy bugXhunter using a long-running workflow_dispatch
  # This creates a persistent server that runs for up to 30 days
  # You can start it manually anytime via GitHub Actions UI
#  deploy-bugxhunter:
  #  name: Deploy bugXhunter Server
