name: Build Minimal Receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Clone bugXhunter Repo
        run: |
          git clone https://github.com/sakuraonijinn/bugXhunter.git bugxhunter-src
          echo "C source available at: $(pwd)/bugxhunter-src/c/receiver/audio_receiver.c"
          ls -la xbug-receiver/ 2>/dev/null || echo "xbug-receiver NOT found at root"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            build-tools;34.0.0
            platform-tools
            platforms;android-34
            ndk;25.1.8937393

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-release-key.keystore \
          -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug, O=Android, C=US"

      - name: Build Native Binary (audio_receiver)
        run: |
          NDK=$ANDROID_HOME/ndk/25.1.8937393
          if [ ! -d "$NDK" ]; then
            NDK=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using NDK: $NDK"
          mkdir -p xbug-receiver/app/src/main/assets
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
            -O2 -o xbug-receiver/app/src/main/assets/audio_receiver \
            bugxhunter-src/c/receiver/audio_receiver.c \
            -lm -llog
          echo "Native binary built: $(ls -lh xbug-receiver/app/src/main/assets/audio_receiver)"
          chmod +x xbug-receiver/app/src/main/assets/audio_receiver

      - name: Build APK
        working-directory: xbug-receiver/app
        run: |
          if [ ! -f "gradlew" ]; then
            echo "No gradlew found, installing gradle..."
            mkdir -p /tmp/gradle
            cd /tmp/gradle
            if [ ! -f "gradle-8.7-bin.zip" ]; then
              wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip || curl -sL -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            fi
            unzip -q gradle-8.7-bin.zip
            export PATH=/tmp/gradle/gradle-8.7/bin:$PATH
            cd "$GITHUB_WORKSPACE/xbug-receiver/app"
            gradle wrapper 2>&1
          fi
          chmod +x gradlew 2>/dev/null || true

          echo "=== Running Gradle build ==="
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon 2>&1 | tail -30
          else
            echo "No gradlew available"
            java -version 2>&1
            ls -la build/ 2>/dev/null || echo "No build dir"
          fi

      - name: Find APK
        run: |
          echo "=== All APK files found ==="
          find . -name "*.apk" 2>/dev/null || echo "No APKs found"
          echo "=== app/build contents ==="
          ls -la xbug-receiver/app/build/ 2>/dev/null || echo "No build directory"
          echo "=== app/outputs contents ==="
          find xbug-receiver/app/build/outputs -type f 2>/dev/null || echo "No outputs directory"

      - name: Sign APK
        run: |
          UNSIGNED=$(find xbug-receiver/app/build/outputs/apk/debug -name "*-debug.apk" ! -name "*-signed.apk" -o -name "*-unsigned.apk" 2>/dev/null | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find . -name "*.apk" ! -name "*-signed.apk" 2>/dev/null | head -1)
          fi
          echo "Unsigned APK: $UNSIGNED"
          if [ -z "$UNSIGNED" ]; then
            echo "No unsigned APK found!"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          apksigner sign \
            --ks my-release-key.keystore \
            --ks-pass pass:android \
            --ks-key-alias my-alias \
            --out signed.apk \
            "$UNSIGNED"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalReceiverAPK
          path: signed.apk