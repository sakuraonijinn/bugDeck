plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bugtraqapps.bugdeck'
    compileSdk 34

    defaultConfig {
        applicationId "com.bugtraqapps.bugdeck"
        // 24, not 21: dev.rikka.shizuku:api declares minSdkVersion 24 and
        // :provider declares 23, so the manifest merger rejects anything
        // lower. That costs Android 5.x/6.0 users, a couple of percent of
        // devices, and buys the optional Device tab.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signed with the debug keystore so the build is installable as-is
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        // the recovered wordlists + payload data
        main {
            assets.srcDirs += ['../assets']
            // scanner core lives in a sibling module so it stays JVM-testable
            // without an Android device
            java.srcDirs += ['../core/src/main/java']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ContextCompat for colour lookups; also the standard way to touch
    // androidx.core APIs.
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Shizuku is OPTIONAL. BugDeck installs and runs without it; only the
    // Device tab is unavailable. Never a hard requirement.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // No jsoup: the core parses HTML with regex on purpose, so it stays inside
    // the ApiTest "no desktop-only APIs" guarantee. See core/HtmlLinks.java.
}
